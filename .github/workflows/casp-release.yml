name: Release Nexus.Casp.Sdk

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/Nexus.Casp.Sdk/**"
      - ".github/workflows/casp-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: casp-release
  cancel-in-progress: false

env:
  PROJECT: src/Nexus.Casp.Sdk/Nexus.Casp.Sdk.csproj
  TAG_PREFIX: casp-v

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        run: |
          base=$(date -u +%Y.%-m.%-d)
          n=0
          # Revision increments for multiple releases on the same day
          while git rev-parse -q --verify "refs/tags/${TAG_PREFIX}${base}.${n}" >/dev/null; do
            n=$((n + 1))
          done
          version="$base.$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true --output ./nupkg

      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push ./nupkg/*.nupkg -k "$NUGET_API_KEY" -s https://nuget.pkg.github.com/QuantozTechnology/index.json

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git tag -l "${TAG_PREFIX}*" --sort=-creatordate | head -n1)
          gh release create "${{ steps.version.outputs.tag }}" ./nupkg/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "Nexus.Casp.Sdk ${{ steps.version.outputs.version }}" \
            --generate-notes ${prev:+--notes-start-tag "$prev"}
